<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Control panel for a self-hosted Twitch channel points miner: what it earned today, what it is watching, and how its bets are going."
    />
    <!-- Ground colours for the two schemes, so mobile browser chrome matches the panel. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f3f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12151c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2312151c'/%3E%3Cg fill='none' stroke='%23d9a13b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' transform='translate(2.4 2.4) scale(0.8)'%3E%3Cpath d='M13 8l-9.383 9.418a2.091 2.091 0 0 0 0 2.967a2.11 2.11 0 0 0 2.976 0l9.407 -9.385'/%3E%3Cpath d='M9 3h4.586a1 1 0 0 1 .707 .293l6.414 6.414a1 1 0 0 1 .293 .707v4.586a2 2 0 1 1 -4 0v-3l-5 -5h-3a2 2 0 1 1 0 -4'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Twitch Points Miner</title>
    <script>
      // Inlined stand-in for Mantine's ColorSchemeScript: paints the stored
      // scheme before first paint, otherwise a dark-mode user gets a white
      // flash - very visible against a deep graphite ground.
      (function () {
        try {
          var stored = localStorage.getItem("mantine-color-scheme-value");
          var scheme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-mantine-color-scheme", scheme);

          // Same reason: an explicit animation choice must not flash the other
          // state. No stored value means follow the OS, which the CSS does
          // on its own.
          var motion = localStorage.getItem("tpm-motion");
          if (motion === "on" || motion === "off") {
            document.documentElement.setAttribute("data-motion", motion);
          }
        } catch (e) {
          /* private mode: fall through to Mantine's own handling */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
