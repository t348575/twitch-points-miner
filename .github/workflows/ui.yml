name: Node.js CI

on:
  pull_request:
    branches: [ "master" ]
defaults:
  run:
    working-directory: ./frontend
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    - run: bun install
      working-directory: frontend
    - name: Update Browserslist
      run: bun x update-browserslist-db@latest --yes
      working-directory: frontend
    - run: bun run build
      working-directory: frontend
