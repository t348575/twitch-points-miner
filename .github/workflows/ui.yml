name: UI CI

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run format:check
    - run: npm run build
