name: Publish Docker image to GHCR

on:
  push:
    branches: ["**"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build . --file app.dockerfile --tag ghcr.io/keckelt/twitch-points-miner:${{ github.ref_name }}

      - name: Push image
        run: docker push ghcr.io/keckelt/twitch-points-miner:${{ github.ref_name }}
