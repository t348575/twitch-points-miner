[workspace]
members = [
    "app",
    "common",
    "mock"
]
resolver = "2"

[profile.release]
opt-level = 's'
strip = true
codegen-units = 1
lto = true

[workspace.dependencies]
axum = { version = "0.8", features = ["http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
indexmap = { version = "2.9", features = ["serde"] }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
twitch_api = { features = ["tpm", "client", "helix", "reqwest"], git = "https://github.com/t348575/twitch_api.git", branch = "hidden_pubsubs" }
eyre = "0.6"
rand = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
flume = "0.11"
http = "1.3"
validator = { version = "0.20", features = ["derive"] }
rstest = "0.25"
base64 = { version = "0.22", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "json"] }
utoipa = { version = "5", features = ["chrono"] }

# https://github.com/rscarson/rustyscript/issues/332
[patch.crates-io]
deno_media_type = { git = 'https://github.com/denoland/deno_media_type', tag = "0.2.6" }