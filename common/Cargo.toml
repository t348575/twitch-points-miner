[package]
name = "common"
version = "0.1.12"
edition = "2021"

[lib]
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
eyre.workspace = true
rand.workspace = true
twitch_api.workspace = true
indexmap.workspace = true
validator.workspace = true
utoipa = { workspace = true, optional = true }
base64.workspace = true
flume.workspace = true
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
dialoguer = "0.11"
testcontainers = { version = "0.25", optional = true }
ctor = { version = "0.4", optional = true }
rstest = { workspace = true, optional = true }
futures-util = { version = "0.3", default-features = false }
reqwest.workspace = true
rustyscript = { version = "0.11", default-features = false, features = ["web"] }
http.workspace = true
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27.2"

[features]
web_api = ["dep:utoipa", "twitch_api/utoipa"]
testing = ["dep:testcontainers", "dep:ctor", "dep:rstest", "dep:tracing-subscriber"]
