# (Optional) The maximum number of streams to "watch" at once to earn channel points.
# Defaults to 2 if not specified.
max_watching: 2

# (Optional) A list of streamer names (as they appear in their twitch URL)
# to give watch priority to when they are live. The list is ordered from highest priority (first item) to lowest priority (last item).
# The application can "watch" up to `max_watching` streams at once.
# If more than `max_watching` of your configured streamers are live, this list determines
# who gets priority. Streamers not in this list are chosen based on the order
# they appear in the `streamers` section below.
watch_priority:
  - streamer_b

# A map of streamer names (as they appear in their Twitch URL) to their specific configuration.
# You can define a unique configuration for each streamer or use a shared preset.
streamers:
  # This streamer uses a specific, detailed configuration.
  streamer_a:
    !Specific # If true, the bot will automatically follow the streamer if they raid another channel, which gives bonus points.
    follow_raid: true
    # All settings related to automatic betting on predictions.
    prediction:
      # The strategy defines the logic for when and how much to bet.
      # Currently, '!detailed' is the only available prediction strategy.
      strategy: !detailed
        # The 'detailed' strategy allows for multiple rules based on outcome odds.
        # These rules are evaluated in the order they appear.
        # The first 'detailed' rule that matches its conditions (threshold and attempt_rate)
        # will be used to place a bet.
        detailed:
          # Rule 1: Bet on high-probability outcomes.
          - _type: Ge # "Greater than or equal to". The rule applies if the calculated outcome probability is >= threshold.
            threshold: 90.0 # The probability threshold (90%).
            attempt_rate: 100.0 # Chance to place the bet if the threshold is met. 100.0 means it will always bet.
            points:
              max_value: 1000 # The maximum number of channel points to bet.
              # The percentage of your current points to bet.
              # The final bet is min(current_points * (percent / 100), max_value).
              # Here, it's 1% of your points, up to a max of 1000.
              percent: 1.0

          # Rule 2: Place a small, risky bet on low-probability outcomes.
          - _type: Le # "Less than or equal to". Applies if the probability is <= threshold.
            threshold: 10.0 # The probability threshold (10%).
            attempt_rate: 1.0 # Only attempt this bet 1% of the time, even if the odds match.
            points:
              max_value: 1000
              percent: 1.0 # 1% of your points, up to a max of 1000.

          # Rule 3: A less conservative bet on fairly likely outcomes.
          - _type: Ge
            threshold: 70.0
            attempt_rate: 100.0
            points:
              max_value: 5000
              percent: 5.0 # 5% of your points, up to a max of 5000.

          # Rule 4: A slightly riskier bet on less likely outcomes.
          - _type: Le
            threshold: 30.0
            attempt_rate: 3.0 # Only attempt this 3% of the time.
            points:
              max_value: 5000
              percent: 5.0 # 5% of your points, up to a max of 5000.

        # The 'default' strategy is a fallback.
        # It is applied ONLY if none of the 'detailed' rules above were met and
        # the outcome's probability falls within its 'min_percentage' and 'max_percentage' range.
        default:
          # Defines the betting range for outcome probability (e.g., between 45% and 55%).
          # This is useful for betting on outcomes that are close to 50/50.
          min_percentage: 45.0
          max_percentage: 55.0
          points:
            max_value: 100000
            percent: 25.0 # Bet 25% of your points, up to a max of 100,000.

      # Filters are conditions that must ALL be met BEFORE the betting strategy is considered.
      # If any filter fails, no bet is placed, regardless of the strategy.
      filters:
        # Don't bet immediately. Wait until a certain percentage of the prediction time has passed.
        # This allows odds to stabilize. 50.0 means wait for the first half of the window.
        - !DelayPercentage 50.0
        # Only bet if at least this many users have already participated in the prediction.
        # This helps avoid predictions with very few participants and unstable odds.
        - !TotalUsers 300

  # This streamer uses a shared configuration defined in the 'presets' section below.
  streamer_b: !Preset safe_better

# Presets are reusable configurations that can be assigned to multiple streamers.
presets:
  # A preset that will never place a bet. Useful for channels where you only want to farm points.
  # An empty `detailed` list and a `default` range of 0% to 0% ensures no betting conditions are ever met.
  never_bet:
    follow_raid: true
    prediction:
      strategy: !detailed
        default:
          max_percentage: 0.0
          min_percentage: 0.0
          points:
            max_value: 0
            percent: 0.0
      filters: []

  # A preset for safe betting. Focuses on high-probability outcomes with a small part of your points.
  safe_better:
    follow_raid: true
    prediction:
      strategy: !detailed
        detailed:
          - _type: Ge
            threshold: 85.0 # Bet on outcomes with >= 85% probability.
            attempt_rate: 100.0 # Always bet if the condition is met.
            points:
              max_value: 2000 # Max bet of 2000 points.
              percent: 2.0 # Bet 2% of your available points.
        default:
          # Don't bet on anything that isn't a high-probability outcome.
          min_percentage: 0.0
          max_percentage: 0.0
          points:
            max_value: 0
            percent: 0.0
      filters:
        - !DelayPercentage 66.0 # Wait for 66% of the prediction time to pass.
        - !TotalUsers 15 # Wait for at least 15 users to bet.

  # A high-risk, high-reward preset. Bets a large amount on risky outcomes. YOLO!
  yolo:
    follow_raid: true
    prediction:
      strategy: !detailed
        detailed:
          # Bet on very unlikely outcomes (long shots).
          - _type: Le
            threshold: 15.0 # Bet if probability is <= 15%.
            attempt_rate: 5.0 # Only try this 5% of the time to avoid losing points too quickly.
            points:
              max_value: 25000 # Bet up to 25,000 points.
              percent: 15.0 # Bet 15% of your total points.
        default:
          # Also bet on outcomes that are roughly even.
          min_percentage: 48.0
          max_percentage: 52.0
          points:
            max_value: 10000
            percent: 10.0 # Bet 10% of your points.
      filters: [] # No filters, bet as soon as a prediction is available.
